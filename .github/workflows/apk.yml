name: Build APK

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Optional release version, e.g. v0.1.1 (leave empty for a test APK)'
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      release_tag: ${{ steps.version.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '21'
      - name: Set APK version
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os, re
          import xml.etree.ElementTree as E
          E.register_namespace('android', 'http://schemas.android.com/apk/res/android')
          tree = E.parse('AndroidManifest.xml')
          root = tree.getroot()
          prefix = '{http://schemas.android.com/apk/res/android}'
          number = int(os.environ['GITHUB_RUN_NUMBER'])
          tag = os.environ.get('REQUESTED_TAG', '')
          if os.environ['GITHUB_REF'].startswith('refs/tags/'):
              tag = os.environ['GITHUB_REF_NAME']
          if tag and not re.fullmatch(r'v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)(?:-(?:alpha|beta|rc)\.[0-9]+)?', tag):
              raise SystemExit('Release tag must be vMAJOR.MINOR.PATCH, optionally -alpha.N, -beta.N, or -rc.N')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write('release_tag=' + tag + '\n')
          root.set(prefix + 'versionCode', str(100000 + number))
          root.set(prefix + 'versionName', tag[1:] if tag else root.get(prefix + 'versionName') + '-ci.' + str(number))
          tree.write('AndroidManifest.xml', encoding='utf-8', xml_declaration=True)
          PY
      - name: Run filesystem, archive and theme tests
        run: sh test.sh
      - name: Install checksum-pinned SDK dependencies
        run: sh setup-sdk.sh
      - name: Restore stable development signing key
        if: github.event_name != 'pull_request'
        env:
          KEYSTORE_BASE64: ${{ secrets.CACA_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            mkdir -p .private
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > .private/debug.keystore
            chmod 600 .private/debug.keystore
          else
            echo '::warning::No CACA_DEBUG_KEYSTORE_BASE64 secret. This APK uses a temporary key and cannot update an installation signed by another key.'
          fi
      - name: Compile and verify Honeycomb APK
        run: sh build.sh
      - name: Upload APK and SHA-256
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: CacaExplorer-apk-${{ github.run_number }}
          path: |
            dist/*.apk
            dist/*.sha256
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs: build
    if: needs.build.outputs.release_tag != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RUN_ID: ${{ github.run_id }}
      ARTIFACT_NAME: CacaExplorer-apk-${{ github.run_number }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: Download verified APK and checksum
        run: gh run download "$RUN_ID" --name "$ARTIFACT_NAME" --dir release-assets
      - name: Publish APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          # Never replace assets from an already published release on a rerun.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving its assets unchanged."
            exit 0
          fi
          existing=$(gh api "repos/$GH_REPO/commits/$RELEASE_TAG" --jq .sha 2>/dev/null || true)
          if [[ -n "$existing" && "$existing" != "$TARGET_SHA" ]]; then
            echo 'The release tag points to another commit. Run the workflow on that tag instead.' >&2
            exit 1
          fi
          extra=()
          if [[ "$RELEASE_TAG" == *-* ]]; then extra+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/*.apk release-assets/*.sha256 \
            --target "$TARGET_SHA" --title "CacaExplorer ${RELEASE_TAG#v}" \
            --generate-notes "${extra[@]}"
